
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova</title>
<style>
:root {
  --sidebar: #171717;
  --main: #212121;
  --panel: #303030;
  --hover: #2b2b2b;
  --text: #f3f3f3;
  --muted: #a0a0a0;
  --border: #383838;
  --accent: #10a37f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--main);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  height: 100dvh;
  overflow: hidden;
}
button, textarea { font: inherit; }
button { cursor: pointer; color: inherit; }
.app { display: flex; height: 100dvh; }

/* SIDEBAR */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--sidebar);
  display: flex;
  flex-direction: column;
  padding: 12px;
  transition: width .2s, transform .2s;
  overflow: hidden;
}
.sidebar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 4px 22px;
}
.brand {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -.7px;
}
.logo {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  background: var(--accent);
  display: grid;
  place-items: center;
  color: white;
  font-size: 19px;
  font-weight: 800;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border: 0;
  background: transparent;
  border-radius: 9px;
  color: var(--muted);
  display: grid;
  place-items: center;
  font-size: 19px;
}
.icon-btn:hover, .side-btn:hover { background: var(--hover); color: var(--text); }
.side-btn {
  width: 100%;
  padding: 11px 12px;
  border: 0;
  background: transparent;
  text-align: left;
  border-radius: 9px;
  display: flex;
  gap: 11px;
  align-items: center;
  font-size: 14px;
  white-space: nowrap;
}
.side-btn .symbol { width: 20px; font-size: 18px; text-align: center; }
.section-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  padding: 24px 10px 9px;
}
.history { flex: 1; overflow-y: auto; min-height: 0; }
.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  border-radius: 8px;
  margin: 2px 0;
}
.history-item.active { background: #2a2a2a; }
.history-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  padding: 10px;
  flex: 1;
  cursor: pointer;
}
.delete-chat {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 6px 8px;
  border-radius: 6px;
}
.delete-chat:hover { background: #444; }
.profile {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  margin-top: 10px;
}
.profile-row { display: flex; align-items: center; gap: 10px; padding: 8px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: #6750a4; display: grid; place-items: center;
  font-size: 13px; font-weight: 700;
}
.profile-name { font-size: 13px; font-weight: 600; }
.profile-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }

/* MAIN CHAT */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.topbar {
  height: 60px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--main);
}
.top-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
.mobile-menu { display: none; }
.model-select {
  background: transparent;
  color: var(--text);
  border: 0;
  padding: 8px 10px;
  border-radius: 9px;
  font-size: 17px;
  font-weight: 600;
}
.model-select:hover { background: var(--hover); }
.model-sub { color: var(--muted); font-size: 12px; }
.top-actions { display: flex; gap: 5px; align-items: center; }
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  display: inline-block; background: #e0a43a; margin-right: 6px;
}
.status { font-size: 12px; color: var(--muted); }

.chat-scroll {
  flex: 1;
  overflow-y: auto;
  scroll-behavior: smooth;
}
.chat-inner {
  max-width: 790px;
  margin: 0 auto;
  padding: 30px 24px 35px;
  width: 100%;
}
.welcome {
  min-height: 55vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 15px;
}
.welcome-logo {
  width: 54px; height: 54px; border-radius: 17px;
  background: var(--accent); display: grid; place-items: center;
  font-size: 30px; font-weight: 800; margin-bottom: 5px;
}
.welcome h1 { font-size: 29px; letter-spacing: -.9px; margin: 0; font-weight: 600; }
.welcome p { margin: 0; color: var(--muted); font-size: 15px; }
.suggestions {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; width: min(100%, 570px); margin-top: 20px;
}
.suggestion {
  border: 1px solid #414141; background: transparent;
  color: #dedede; text-align: left; padding: 14px;
  border-radius: 13px; font-size: 13px; line-height: 1.45;
}
.suggestion:hover { background: var(--hover); }
.suggestion strong { display: block; font-size: 14px; margin-bottom: 4px; }
.message { display: flex; gap: 15px; margin: 25px 0; align-items: flex-start; }
.message-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  flex-shrink: 0; display: grid; place-items: center;
  font-size: 15px; font-weight: 700;
}
.user-avatar { background: #6750a4; }
.nova-avatar { background: var(--accent); color: white; }
.message-content { flex: 1; min-width: 0; line-height: 1.7; font-size: 15px; overflow-wrap: anywhere; }
.message-content p { margin: 0 0 12px; }
.message-content p:last-child { margin-bottom: 0; }
.message-content pre {
  background: #141414; border: 1px solid var(--border);
  padding: 14px; border-radius: 10px; overflow-x: auto;
  white-space: pre-wrap;
}
.message-content code { font-family: ui-monospace, monospace; font-size: 13px; }
.message-content img { max-width: 100%; border-radius: 12px; margin-top: 10px; }
.message-tools { display: flex; gap: 5px; margin-top: 9px; }
.message-tools button {
  border: 0; background: transparent; color: var(--muted);
  border-radius: 6px; padding: 5px 7px; font-size: 13px;
}
.message-tools button:hover { background: var(--hover); color: white; }
.typing { color: var(--muted); display: flex; gap: 5px; padding: 5px 0; }
.typing span { animation: blink 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

/* COMPOSER */
.composer-area {
  flex-shrink: 0;
  padding: 12px 20px 13px;
  background: linear-gradient(transparent, var(--main) 18%);
}
.composer-wrap { max-width: 790px; margin: 0 auto; }
.composer {
  background: #303030;
  border: 1px solid #454545;
  border-radius: 25px;
  padding: 10px 12px;
  box-shadow: 0 5px 25px #00000012;
}
.composer:focus-within { border-color: #555; }
#prompt {
  display: block; width: 100%; resize: none; outline: none;
  border: 0; background: transparent; color: var(--text);
  padding: 7px 7px 12px; min-height: 42px; max-height: 180px;
  line-height: 1.5; font-size: 15px;
}
#prompt::placeholder { color: #a6a6a6; }
.composer-bottom { display: flex; align-items: center; justify-content: space-between; }
.composer-tools { display: flex; align-items: center; gap: 5px; }
.tool-btn {
  border: 0; background: transparent; color: #c3c3c3;
  border-radius: 50%; min-width: 35px; height: 35px;
  display: grid; place-items: center; font-size: 20px;
}
.tool-btn:hover { background: #454545; }
.tool-btn:disabled { opacity: .4; cursor: default; }
.send-btn {
  width: 36px; height: 36px; border: 0; border-radius: 50%;
  background: #f3f3f3; color: #1b1b1b; font-size: 20px;
  display: grid; place-items: center; font-weight: 700;
}
.send-btn:hover { background: #d7d7d7; }
.send-btn:disabled { opacity: .4; cursor: default; }
.disclaimer { text-align: center; color: #8f8f8f; font-size: 11px; margin-top: 10px; }
.toast {
  position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
  background: #333; border: 1px solid #555; border-radius: 10px;
  padding: 10px 15px; font-size: 13px; z-index: 10; display: none;
}
.file-chip {
  display: none; margin: 0 5px 8px; padding: 7px 10px;
  background: #414141; border-radius: 9px; font-size: 12px;
}
#imageInput { display: none; }

@media (max-width: 700px) {
  .sidebar {
    position: fixed; z-index: 30; inset: 0 auto 0 0;
    width: 270px; transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); }
  .mobile-menu { display: grid; }
  .topbar { padding: 0 10px; }
  .chat-inner { padding: 18px 16px 25px; }
  .composer-area { padding: 8px 10px 10px; }
  .welcome { min-height: 45vh; }
  .welcome h1 { font-size: 25px; }
  .suggestions { grid-template-columns: 1fr; }
  .suggestion:nth-child(n+3) { display: none; }
  .status { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand"><div class="logo">N</div> Nova</div>
      <button class="icon-btn" id="closeSidebar" title="Close sidebar">☰</button>
    </div>

    <button class="side-btn" id="newChat"><span class="symbol">＋</span> New chat</button>
    <button class="side-btn" id="imageMode"><span class="symbol">▧</span> Create an image</button>
    <button class="side-btn" id="voiceMode"><span class="symbol">♩</span> Voice input</button>

    <div class="section-label">Your chats</div>
    <div class="history" id="history"></div>

    <div class="profile">
      <button class="side-btn" id="settingsBtn"><span class="symbol">⚙</span> Settings</button>
      <div class="profile-row">
        <div class="avatar">N</div>
        <div><div class="profile-name">Nova User</div><div class="profile-sub">Personal assistant</div></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn mobile-menu" id="openSidebar" title="Open menu">☰</button>
        <button class="model-select" id="modelBtn">Nova <span style="color:#999;font-size:13px">⌄</span></button>
        <span class="model-sub">AI assistant</span>
      </div>
      <div class="top-actions">
        <span class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">Connecting...</span></span>
        <button class="icon-btn" id="clearBtn" title="New chat">＋</button>
      </div>
    </header>

    <div class="toast" id="toast"></div>

    <section class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">N</div>
          <h1>What can I help with?</h1>
          <p>Ask Nova anything.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Explain a difficult topic in a simple way."><strong>📚 Learn something</strong>Explain a difficult topic simply</button>
            <button class="suggestion" data-prompt="Give me some creative ideas for a project."><strong>💡 Brainstorm ideas</strong>Come up with something creative</button>
            <button class="suggestion" data-prompt="Help me write or improve something."><strong>✍️ Write something</strong>Get help with writing</button>
            <button class="suggestion" data-prompt="Make me an image of a futuristic AI assistant in a cinematic style."><strong>🎨 Create an image</strong>Turn an idea into an image</button>
          </div>
        </div>
        <div id="messages"></div>
      </div>
    </section>

    <footer class="composer-area">
      <div class="composer-wrap">
        <div class="composer">
          <div class="file-chip" id="fileChip"></div>
          <textarea id="prompt" rows="1" placeholder="Message Nova" aria-label="Message Nova"></textarea>
          <div class="composer-bottom">
            <div class="composer-tools">
              <button class="tool-btn" id="attachBtn" title="Attach an image">＋</button>
              <button class="tool-btn" id="imageBtn" title="Generate an image">▧</button>
              <button class="tool-btn" id="micBtn" title="Voice input">🎙</button>
              <input id="imageInput" type="file" accept="image/*">
            </div>
            <button class="send-btn" id="sendBtn" title="Send message">↑</button>
          </div>
        </div>
        <div class="disclaimer">Nova can make mistakes. Check important information.</div>
      </div>
    </footer>
  </main>
</div>

<script>
const WORKER_URL = "https://nova-brain.elijahmfiji.workers.dev";

const $ = id => document.getElementById(id);
const promptBox = $("prompt");
const messagesBox = $("messages");
const welcome = $("welcome");
const historyBox = $("history");

let chats = [];
let activeChatId = null;
let busy = false;
let attachedImage = null;
let imageMode = false;

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function createChat() {
  const chat = { id: makeId(), title: "New chat", messages: [] };
  chats.unshift(chat);
  activeChatId = chat.id;
  renderHistory();
  renderMessages();
  promptBox.focus();
}

function activeChat() {
  return chats.find(c => c.id === activeChatId);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function formatText(text) {
  let safe = escapeHtml(text);
  safe = safe.replace(/```([\w-]*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${code.trim()}</code></pre>`
  );
  safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
  safe = safe.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  safe = safe.replace(/\*(.*?)\*/g, "<em>$1</em>");
  safe = safe.replace(/\n/g, "<br>");
  return safe;
}

function renderHistory() {
  historyBox.innerHTML = "";
  chats.forEach(chat => {
    const row = document.createElement("div");
    row.className = "history-item" + (chat.id === activeChatId ? " active" : "");

    const title = document.createElement("div");
    title.className = "history-title";
    title.textContent = chat.title;
    title.title = chat.title;
    title.onclick = () => {
      activeChatId = chat.id;
      renderHistory();
      renderMessages();
      if (innerWidth <= 700) $("sidebar").classList.remove("open");
    };

    const del = document.createElement("button");
    del.className = "delete-chat";
    del.textContent = "×";
    del.title = "Delete chat";
    del.onclick = e => {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== chat.id);
      if (activeChatId === chat.id) {
        activeChatId = chats[0]?.id || null;
        if (!activeChatId) createChat();
      }
      renderHistory();
      renderMessages();
    };

    row.append(title, del);
    historyBox.appendChild(row);
  });
}

function renderMessages() {
  const chat = activeChat();
  messagesBox.innerHTML = "";
  welcome.style.display = chat && chat.messages.length ? "none" : "flex";

  if (!chat) return;

  chat.messages.forEach((msg, index) => {
    const row = document.createElement("div");
    row.className = "message";

    const avatar = document.createElement("div");
    avatar.className = "message-avatar " +
      (msg.role === "user" ? "user-avatar" : "nova-avatar");
    avatar.textContent = msg.role === "user" ? "U" : "N";

    const content = document.createElement("div");
    content.className = "message-content";

    if (msg.image) {
      const img = document.createElement("img");
      img.src = msg.image;
      img.alt = "Image generated by Nova";
      content.appendChild(img);
    } else {
      content.innerHTML = formatText(msg.content);
    }

    const tools = document.createElement("div");
    tools.className = "message-tools";

    if (msg.role === "assistant" && msg.content) {
      const copy = document.createElement("button");
      copy.textContent = "▢ Copy";
      copy.onclick = () => {
        navigator.clipboard.writeText(msg.content)
          .then(() => showToast("Copied to clipboard"))
          .catch(() => showToast("Couldn't copy automatically"));
      };
      tools.appendChild(copy);

      const speak = document.createElement("button");
      speak.textContent = "🔊 Read aloud";
      speak.onclick = () => speakText(msg.content);
      tools.appendChild(speak);
    }

    content.appendChild(tools);
    row.append(avatar, content);
    messagesBox.appendChild(row);
  });

  scrollToBottom();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    const scroller = $("chatScroll");
    scroller.scrollTop = scroller.scrollHeight;
  });
}

function showToast(text) {
  const toast = $("toast");
  toast.textContent = text;
  toast.style.display = "block";
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.style.display = "none", 2400);
}

function addMessage(role, content, extra = {}) {
  const chat = activeChat();
  if (!chat) return;
  chat.messages.push({ role, content, ...extra });

  if (role === "user" && chat.title === "New chat") {
    chat.title = content.slice(0, 32) + (content.length > 32 ? "…" : "");
    renderHistory();
  }
  renderMessages();
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "message";
  row.id = "typingRow";
  row.innerHTML = '<div class="message-avatar nova-avatar">N</div><div class="message-content"><div class="typing"><span>●</span><span>●</span><span>●</span></div></div>';
  messagesBox.appendChild(row);
  scrollToBottom();
}

function setBusy(value) {
  busy = value;
  $("sendBtn").disabled = value;
  promptBox.disabled = value;
  $("statusText").textContent = value ? "Thinking..." : "Ready";
  $("statusDot").style.background = value ? "#e0a43a" : "#10a37f";
}

async function sendMessage(forcedText) {
  if (busy) return;

  const text = (forcedText ?? promptBox.value).trim();
  if (!text && !attachedImage) return;

  if (!activeChat()) createChat();

  const imageToAttach = attachedImage;
  attachedImage = null;
  $("fileChip").style.display = "none";

  promptBox.value = "";
  resizeInput();
  setBusy(true);

  addMessage("user", text || "What is in this image?", imageToAttach ? { image: imageToAttach } : {});
  const chat = activeChat();

  try {
    // Generate an image when requested directly or through image mode.
    const wantsImage = imageMode || /\b(make|create|generate|draw)\s+(me\s+)?(an?\s+)?image\b/i.test(text);

    if (wantsImage) {
      imageMode = false;
      $("imageBtn").style.color = "";

      const response = await fetch(WORKER_URL + "/image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: text || "A beautiful imaginative digital artwork" })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Image generation failed.");

      chat.messages.push({
        role: "assistant",
        content: "Here's your image.",
        image: data.image
      });
      renderMessages();
      return;
    }

    const apiMessages = [
      { role: "system", content:
        "You are Nova, a helpful, friendly AI assistant. Be clear, accurate, and conversational. Format answers using Markdown when helpful. If the user asks for code, provide complete, copy-paste-ready code when practical. Never claim to have performed actions you did not perform."
      },
      ...chat.messages
        .filter(m => !m.image && m.content)
        .slice(-30)
        .map(m => ({ role: m.role, content: m.content }))
    ];

    showTyping();
    const response = await fetch(WORKER_URL + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: apiMessages })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Nova couldn't respond.");
    if (!data.reply) throw new Error("The server returned an empty reply.");

    chat.messages.push({ role: "assistant", content: data.reply });
  } catch (error) {
    const row = $("typingRow");
    if (row) row.remove();

    addMessage("assistant", "I couldn't connect right now. " + error.message +
      "\n\nCheck that your Cloudflare Worker is deployed and that its `/chat` and `/image` endpoints are working.");
  } finally {
    const row = $("typingRow");
    if (row) row.remove();
    setBusy(false);
    renderHistory();
    renderMessages();
    promptBox.focus();
  }
}

function resizeInput() {
  promptBox.style.height = "auto";
  promptBox.style.height = Math.min(promptBox.scrollHeight, 180) + "px";
}

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    showToast("Text-to-speech isn't supported in this browser.");
    return;
  }
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1;
  speechSynthesis.speak(utterance);
}

function startVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast("Voice input isn't supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.onstart = () => showToast("Listening...");
  recognition.onresult = event => {
    promptBox.value = event.results[0][0].transcript;
    resizeInput();
    promptBox.focus();
  };
  recognition.onerror = () => showToast("Couldn't hear that. Try again.");
  recognition.start();
}

async function checkConnection() {
  try {
    const response = await fetch(WORKER_URL + "/");
    if (!response.ok) throw new Error();
    $("statusText").textContent = "Online";
    $("statusDot").style.background = "#10a37f";
  } catch {
    $("statusText").textContent = "Check connection";
    $("statusDot").style.background = "#e05252";
  }
}

$("sendBtn").onclick = () => sendMessage();
promptBox.addEventListener("input", resizeInput);
promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

$("newChat").onclick = () => createChat();
$("clearBtn").onclick = () => createChat();
$("closeSidebar").onclick = () => $("sidebar").classList.remove("open");
$("openSidebar").onclick = () => $("sidebar").classList.toggle("open");

$("imageBtn").onclick = () => {
  imageMode = !imageMode;
  $("imageBtn").style.color = imageMode ? "var(--accent)" : "";
  promptBox.placeholder = imageMode ? "Describe the image you want to create..." : "Message Nova";
  promptBox.focus();
  if (imageMode) showToast("Image mode on — describe what you want.");
};

$("imageMode").onclick = () => {
  imageMode = true;
  $("imageBtn").style.color = "var(--accent)";
  promptBox.placeholder = "Describe the image you want to create...";
  promptBox.focus();
  if (innerWidth <= 700) $("sidebar").classList.remove("open");
};

$("micBtn").onclick = startVoice;
$("voiceMode").onclick = startVoice;
$("attachBtn").onclick = () => $("imageInput").click();

$("imageInput").onchange = event => {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    showToast("Please choose an image file.");
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    showToast("Please choose an image under 5 MB.");
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    attachedImage = reader.result;
    $("fileChip").textContent = "📎 " + file.name + "  ×";
    $("fileChip").style.display = "block";
    $("fileChip").onclick = () => {
      attachedImage = null;
      $("fileChip").style.display = "none";
    };
    promptBox.focus();
  };
  reader.readAsDataURL(file);
  event.target.value = "";
};

$("settingsBtn").onclick = () => {
  const color = prompt("Choose an accent color (hex), for example #10a37f:", getComputedStyle(document.documentElement).getPropertyValue("--accent").trim());
  if (color && /^#[0-9a-f]{6}$/i.test(color.trim())) {
    document.documentElement.style.setProperty("--accent", color.trim());
    showToast("Accent color updated");
  } else if (color) {
    showToast("Enter a valid hex color like #10a37f");
  }
};

$("modelBtn").onclick = () => showToast("Nova is powered by your connected Cloudflare Worker and Groq model.");

document.querySelectorAll(".suggestion").forEach(button => {
  button.onclick = () => {
    promptBox.value = button.dataset.prompt;
    resizeInput();
    sendMessage();
  };
});

createChat();
checkConnection();
setInterval(checkConnection, 60000);
</script>
</body>
</html>
