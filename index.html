
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071326">
<title>Nova AI</title>
<style>
:root {
  --bg:#071326;--sidebar:#061326;--panel:#0c1d33;--panel2:#102743;
  --border:rgba(65,183,255,.2);--blue:#159bff;--cyan:#37eaff;
  --text:#edf7ff;--muted:#829bb6;--orange:#ffad42;
}
*{box-sizing:border-box}
body{margin:0;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 75% -20%,#103b68,transparent 45%),radial-gradient(ellipse at 100% 90%,#102b4b,transparent 40%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
button,textarea{font:inherit}button{cursor:pointer}
.app{display:flex;height:100dvh;width:100%}
.sidebar{width:270px;flex-shrink:0;background:rgba(5,17,32,.97);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;z-index:5}
.brand{display:flex;align-items:center;gap:11px;padding:4px 7px 25px}
.brand-icon{height:42px;width:42px;border-radius:14px;display:grid;place-items:center;color:#001529;font-size:21px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 24px #009dff45}
.brand-name{font-size:23px;font-weight:850;letter-spacing:2px}.brand-name span{color:var(--cyan)}
.brand-sub{color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:3px}
.new-chat,.side-button{border:1px solid var(--border);color:var(--text);background:linear-gradient(135deg,#102c49,#0b1b30);border-radius:12px;padding:12px;text-align:left;transition:.2s}
.new-chat:hover,.side-button:hover{border-color:var(--cyan);box-shadow:0 0 25px #00b0ff20}
.new-chat{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:24px}
.section-label{font-size:10px;font-weight:800;letter-spacing:2px;color:#718aa5;padding:0 9px 11px}
.history{flex:1;overflow-y:auto}
.history-item{display:flex;align-items:center;gap:8px;margin:3px 0;border:1px solid transparent;border-radius:9px;padding:10px;color:#b8cce0;font-size:13px;cursor:pointer}
.history-item:hover,.history-item.active{background:#112b45;border-color:var(--border);color:white}
.history-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.delete-chat{border:0;background:transparent;color:#7991aa;padding:3px;opacity:0}
.history-item:hover .delete-chat{opacity:1}.delete-chat:hover{color:#ff8585}
.side-bottom{border-top:1px solid var(--border);padding-top:15px;display:grid;gap:9px}
.status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding:5px 7px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#38f5bc;box-shadow:0 0 10px #38f5bc}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:66px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 26px;border-bottom:1px solid var(--border);background:#071326bb;backdrop-filter:blur(18px)}
.top-left,.top-right{display:flex;align-items:center;gap:12px}
.menu-button{display:none;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 11px;border-radius:9px}
.top-title{font-size:14px;font-weight:750;letter-spacing:.5px}
.model-pill{border:1px solid #28b8ff3d;background:#0d2842;color:var(--cyan);font-size:10px;padding:6px 10px;border-radius:20px;letter-spacing:.7px}
.icon-button{width:37px;height:37px;border:1px solid var(--border);background:#10243a;color:#b7d5ef;border-radius:11px}
.icon-button:hover{border-color:var(--cyan);color:var(--cyan)}
.chat-scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.chat-content{max-width:900px;margin:0 auto;padding:30px 26px 38px}
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px 0 35px}
.robot-orb{position:relative;height:100px;width:100px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(145deg,#143e63,#07172b 70%);border:1px solid #35dfff88;box-shadow:0 0 0 7px #149fff0c,0 0 45px #079fff32,inset 0 0 25px #159bff18;margin-bottom:27px}
.robot-face{width:70px;height:43px;border-radius:19px 19px 23px 23px;background:linear-gradient(150deg,#061126,#123e69);border:2px solid #1acaff;display:flex;align-items:center;justify-content:center;gap:15px;box-shadow:0 0 15px #04aaff55}
.eye{height:12px;width:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 13px var(--cyan);animation:blink 4s infinite}
@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.15)}}
.orbit{position:absolute;inset:-10px;border:1px solid #23caff26;border-radius:36px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.06);opacity:1}}
.welcome h1{margin:0;font-size:clamp(29px,4vw,43px);letter-spacing:-1.5px;font-weight:850}
.gradient-text{background:linear-gradient(90deg,#fff 5%,#42e8ff 48%,#1b9dff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:#90a9c3;max-width:450px;line-height:1.7;font-size:14px;margin:14px 0 29px}
.quick-grid{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:570px}
.quick-card{text-align:left;padding:16px;min-height:96px;background:linear-gradient(145deg,#102640,#0a1a2d);border:1px solid var(--border);border-radius:15px;color:var(--text);transition:.2s}
.quick-card:hover{transform:translateY(-3px);border-color:#25d9ff88;box-shadow:0 0 25px #00b0ff20}
.quick-icon{font-size:20px;display:block;margin-bottom:9px}
.quick-card strong{font-size:12px;display:block}.quick-card small{color:#829bb6;font-size:11px;display:block;margin-top:5px;line-height:1.4}
.message{display:flex;gap:13px;margin:25px 0;align-items:flex-start;animation:appear .2s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.avatar{flex-shrink:0;height:34px;width:34px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:900;background:linear-gradient(135deg,#153d60,#091a2e);border:1px solid #27cfff66;color:var(--cyan)}
.message.user .avatar{background:linear-gradient(135deg,#174f79,#11263e);color:white}
.message-body{min-width:0;flex:1;padding-top:5px;line-height:1.75;font-size:14px;overflow-wrap:anywhere}
.message-name{font-size:11px;color:#81a0bc;font-weight:800;letter-spacing:1px;margin-bottom:7px}
.message-body pre{background:#050d19;border:1px solid var(--border);border-radius:12px;padding:15px;overflow-x:auto;white-space:pre}
.message-body code{background:#122943;border-radius:5px;padding:2px 5px;font-family:ui-monospace,monospace;font-size:12px}
.message-body pre code{background:transparent;padding:0}
.message-body a{color:var(--cyan)}
.generated-image{display:block;max-width:100%;width:min(100%,600px);border-radius:15px;border:1px solid #29caff55;box-shadow:0 0 25px #009fff20}
.message-actions{display:flex;gap:8px;margin-top:10px}
.message-actions button{color:#829bb6;background:transparent;border:1px solid transparent;padding:4px 8px;border-radius:7px;font-size:11px}
.message-actions button:hover{color:var(--cyan);border-color:var(--border)}
.typing{color:var(--cyan);letter-spacing:3px;animation:pulse 1s infinite}
.composer-wrap{flex-shrink:0;padding:10px 22px 17px;background:linear-gradient(0deg,#071326 75%,transparent)}
.composer-inner{max-width:850px;margin:0 auto}
.mode-row{display:flex;gap:8px;margin-bottom:10px}
.mode-button{border:1px solid #28425b;color:#9eb4c9;background:#0c1c30;padding:8px 13px;border-radius:22px;font-size:11px;transition:.2s}
.mode-button.active{color:#e9fbff;border-color:#29d9ff;background:linear-gradient(120deg,#103c5c,#10233c);box-shadow:0 0 12px #03baff15}
.mode-button.active:before{content:"● ";color:var(--cyan)}
.composer{display:flex;align-items:flex-end;gap:10px;border:1px solid #2b5675;background:linear-gradient(145deg,#10253c,#0b1b2d);border-radius:20px;padding:12px 12px 12px 18px;box-shadow:inset 0 1px #ffffff08;transition:.2s}
.composer:focus-within{border-color:#28cfff;box-shadow:0 0 0 3px #08bfff12,0 0 25px #008dff17}
#prompt{resize:none;min-height:27px;max-height:180px;flex:1;width:100%;color:var(--text);background:transparent;border:none;outline:none;font-size:14px;line-height:1.6}
#prompt::placeholder{color:#718ba6}
.send-button{flex-shrink:0;height:39px;width:39px;border:0;border-radius:13px;background:linear-gradient(135deg,#39efff,#168bff);color:#041326;font-size:20px;font-weight:900;box-shadow:0 0 18px #159bff35;transition:.2s}
.send-button:hover{transform:scale(1.05)}.send-button:disabled{opacity:.4;cursor:not-allowed}
.disclaimer{text-align:center;color:#5e7791;font-size:10px;padding-top:10px}
@media(max-width:720px){
.sidebar{position:fixed;inset:0 auto 0 0;height:100dvh;transform:translateX(-105%);transition:transform .25s;width:280px;box-shadow:10px 0 35px #0006}
.sidebar.open{transform:translateX(0)}.menu-button{display:block}
.topbar{padding:0 13px;height:58px}.top-title{font-size:13px}.model-pill{display:none}
.chat-content{padding:18px 15px 25px}.composer-wrap{padding:8px 12px 12px}
.quick-grid{gap:8px}.quick-card{padding:12px}.welcome h1{font-size:31px}
.robot-orb{height:84px;width:84px}
}
@media(max-width:380px){.quick-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">N</div>
      <div><div class="brand-name">NO<span>VA</span></div><div class="brand-sub">INTELLIGENCE SYSTEM</div></div>
    </div>
    <button class="new-chat" id="newChat">＋ &nbsp; New conversation</button>
    <div class="section-label">YOUR CONVERSATIONS</div>
    <div class="history" id="history"></div>
    <div class="side-bottom">
      <div class="status"><span class="status-dot"></span> Nova systems ready</div>
      <button class="side-button" id="clearHistory">⌫ &nbsp; Clear conversation history</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="menu-button" id="menuButton">☰</button>
        <div class="top-title">NOVA <span style="color:var(--cyan)">/</span> AI ASSISTANT</div>
        <span class="model-pill">● GROQ POWERED</span>
      </div>
      <div class="top-right"><button class="icon-button" id="newChatTop" title="New conversation">＋</button></div>
    </header>

    <section class="chat-scroll" id="chatScroll"><div class="chat-content" id="chatContent"></div></section>

    <footer class="composer-wrap">
      <div class="composer-inner">
        <div class="mode-row">
          <button class="mode-button active" id="chatMode">Chat</button>
          <button class="mode-button" id="imageMode">▧ Create image</button>
        </div>
        <form class="composer" id="chatForm">
          <textarea id="prompt" rows="1" placeholder="Message Nova..." autocomplete="off"></textarea>
          <button class="send-button" id="sendButton" type="submit" title="Send message">↑</button>
        </form>
        <div class="disclaimer">NOVA AI · BUILT FOR WHAT'S NEXT</div>
      </div>
    </footer>
  </main>
</div>

<script>
const WORKER_URL = "https://nova-brain.elijahmfiji.workers.dev";
const STORAGE_KEY = "nova_neon_chats_v2";
const $ = id => document.getElementById(id);

let chats = [];
let currentId = null;
let mode = "chat";
let busy = false;

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function loadChats() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (Array.isArray(saved)) chats = saved;
  } catch { chats = []; }

  if (!chats.length) createChat(false);
  else {
    currentId = chats[0].id;
    renderHistory();
    renderChat();
  }
}

function saveChats() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chats)); }
  catch (e) { console.warn("Could not save chats", e); }
}

function currentChat() {
  return chats.find(c => c.id === currentId);
}

function createChat(focus = true) {
  const chat = { id: makeId(), title: "New conversation", messages: [], updated: Date.now() };
  chats.unshift(chat);
  currentId = chat.id;
  saveChats();
  renderHistory();
  renderChat();
  closeSidebar();
  if (focus) $("prompt").focus();
}

function renderHistory() {
  const history = $("history");
  history.replaceChildren();

  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className = "history-item" + (chat.id === currentId ? " active" : "");

    const symbol = document.createElement("span");
    symbol.textContent = "◈";

    const title = document.createElement("span");
    title.className = "history-title";
    title.textContent = chat.title || "New conversation";

    const del = document.createElement("button");
    del.className = "delete-chat";
    del.textContent = "×";
    del.title = "Delete conversation";
    del.addEventListener("click", e => {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== chat.id);
      if (!chats.length) { createChat(false); return; }
      if (currentId === chat.id) currentId = chats[0].id;
      saveChats();
      renderHistory();
      renderChat();
    });

    item.append(symbol, title, del);
    item.addEventListener("click", () => {
      currentId = chat.id;
      renderHistory();
      renderChat();
      closeSidebar();
    });
    history.appendChild(item);
  });
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function formatText(text) {
  let s = escapeHTML(text);
  const blocks = [];

  s = s.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const i = blocks.length;
    blocks.push("<pre><code>" + code.trimEnd() + "</code></pre>");
    return `%%CODEBLOCK${i}%%`;
  });

  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__(.+?)__/g, "<strong>$1</strong>");
  s = s.replace(/\*(.+?)\*/g, "<em>$1</em>");
  s = s.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  s = s.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  s = s.replace(/^# (.+)$/gm, "<h1>$1</h1>");
  s = s.replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>");
  s = s.replace(/^\s*[-*] (.+)$/gm, "<li>$1</li>");
  s = s.replace(/(<li>.*<\/li>\n?)+/g, "<ul>$&</ul>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/\n/g, "<br>");

  blocks.forEach((block, i) => {
    s = s.replace(`%%CODEBLOCK${i}%%`, block);
  });
  return s;
}

function renderChat() {
  const content = $("chatContent");
  content.replaceChildren();
  const chat = currentChat();
  if (!chat) return;

  if (!chat.messages.length) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.innerHTML = `
      <div class="robot-orb"><div class="orbit"></div>
        <div class="robot-face"><span class="eye"></span><span class="eye"></span></div>
      </div>
      <h1>Meet <span class="gradient-text">Nova AI</span></h1>
      <p>Your intelligent assistant, ready to help you create, explore ideas, solve problems, and bring your imagination to life.</p>
      <div class="quick-grid">
        <button class="quick-card" data-prompt="Help me build an awesome project from scratch."><span class="quick-icon">⚡</span><strong>Build something</strong><small>Turn an idea into a real project</small></button>
        <button class="quick-card" data-prompt="Teach me something fascinating that most people don't know."><span class="quick-icon">✧</span><strong>Discover ideas</strong><small>Explore something interesting</small></button>
        <button class="quick-card" data-prompt="Write a complete modern website with HTML, CSS, and JavaScript."><span class="quick-icon">⌘</span><strong>Write code</strong><small>Create, debug, and improve code</small></button>
        <button class="quick-card" data-prompt="Make me an image of a futuristic blue robot assistant."><span class="quick-icon">◇</span><strong>Create an image</strong><small>Generate artwork from a prompt</small></button>
      </div>`;

    content.appendChild(welcome);
    content.querySelectorAll("[data-prompt]").forEach(btn => {
      btn.addEventListener("click", () => {
        $("prompt").value = btn.dataset.prompt;
        autoResize();
        sendMessage();
      });
    });
    return;
  }

  chat.messages.forEach(message => {
    const row = document.createElement("article");
    row.className = "message " + message.role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = message.role === "user" ? "Y" : "N";

    const column = document.createElement("div");
    column.className = "message-body";

    const name = document.createElement("div");
    name.className = "message-name";
    name.textContent = message.role === "user" ? "YOU" : "NOVA";
    column.appendChild(name);

    const text = document.createElement("div");

    if (message.image) {
      const img = document.createElement("img");
      img.className = "generated-image";
      img.src = message.image;
      img.alt = message.content || "Image generated by Nova";
      img.loading = "lazy";
      text.appendChild(img);

      if (message.content) {
        const caption = document.createElement("p");
        caption.textContent = message.content;
        text.appendChild(caption);
      }
    } else {
      text.innerHTML = formatText(message.content || "");
    }

    column.appendChild(text);

    if (message.role === "assistant" && !message.pending) {
      const actions = document.createElement("div");
      actions.className = "message-actions";
      const copy = document.createElement("button");
      copy.textContent = "▢ Copy";
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(message.content || "");
          copy.textContent = "✓ Copied";
          setTimeout(() => copy.textContent = "▢ Copy", 1500);
        } catch { copy.textContent = "Copy unavailable"; }
      });
      actions.appendChild(copy);
      column.appendChild(actions);
    }

    row.append(avatar, column);
    content.appendChild(row);
  });

  $("chatScroll").scrollTop = $("chatScroll").scrollHeight;
}

function addMessage(role, content, extra = {}) {
  const chat = currentChat();
  if (!chat) return;

  const message = { role, content, ...extra };
  chat.messages.push(message);
  chat.updated = Date.now();

  if (role === "user" && chat.title === "New conversation") {
    chat.title = content.slice(0, 36) + (content.length > 36 ? "…" : "");
  }

  saveChats();
  renderHistory();
  renderChat();
  return message;
}

// Detect direct requests for pictures, drawings, artwork, logos, etc.
// Also handles phrases such as "make me a picture of..." and "draw me...".
function wantsImage(text) {
  const t = text.toLowerCase().trim();

  const imageNouns =
    "(?:image|picture|photo|artwork|illustration|wallpaper|logo|thumbnail|drawing|portrait|poster|graphic|visual|avatar)";

  const creationVerbs =
    "(?:make|create|generate|draw|design|render|produce|paint)";

  const patterns = [
    new RegExp("\\b" + creationVerbs + "\\b.{0,100}\\b" + imageNouns + "\\b", "i"),
    new RegExp("\\b" + imageNouns + "\\b.{0,50}\\b(?:of|showing|for|with)\\b", "i"),
    /\bmake me\b.{0,70}\b(?:of|showing)\b/i,
    /\b(?:draw|paint|illustrate)\s+(?:me\s+)?(?:a|an|the|some)\b/i,
    /\b(?:generate|create|make)\s+(?:me\s+)?(?:a|an|some)\s+(?:picture|image|photo|drawing|art|logo|wallpaper)\b/i,
    /\bturn .{1,80} into (?:an image|a picture|a drawing|artwork)\b/i
  ];

  return patterns.some(pattern => pattern.test(t));
}

function showTyping() {
  const content = $("chatContent");
  const row = document.createElement("article");
  row.className = "message";
  row.id = "typingIndicator";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "N";

  const column = document.createElement("div");
  column.className = "message-body";
  column.innerHTML = '<div class="message-name">NOVA</div><span class="typing">● ● ●</span>';

  row.append(avatar, column);
  content.appendChild(row);
  $("chatScroll").scrollTop = $("chatScroll").scrollHeight;
}

function setMode(nextMode) {
  mode = nextMode;
  $("chatMode").classList.toggle("active", mode === "chat");
  $("imageMode").classList.toggle("active", mode === "image");
  $("prompt").placeholder = mode === "image"
    ? "Describe the image Nova should create..."
    : "Message Nova...";
  $("prompt").focus();
}

async function sendMessage() {
  if (busy) return;

  const text = $("prompt").value.trim();
  if (!text) return;

  $("prompt").value = "";
  autoResize();

  // Automatically switch to image generation when the message requests artwork.
  const imageRequest = mode === "image" || wantsImage(text);

  addMessage("user", text);
  busy = true;
  $("sendButton").disabled = true;
  showTyping();

  try {
    if (imageRequest) {
      const response = await fetch(WORKER_URL + "/image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: text })
      });

      const data = await response.json();

      if (!response.ok || !data.image) {
        throw new Error(data.error || "Image generation failed.");
      }

      $("typingIndicator")?.remove();
      addMessage("assistant", text, { image: data.image });
    } else {
      const chat = currentChat();
      const messages = chat.messages
        .filter(m => !m.image && !m.pending)
        .map(m => ({ role: m.role, content: m.content }));

      const response = await fetch(WORKER_URL + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages })
      });

      const data = await response.json();

      if (!response.ok || !data.reply) {
        throw new Error(data.error || "Nova could not answer.");
      }

      $("typingIndicator")?.remove();
      addMessage("assistant", data.reply);
    }
  } catch (error) {
    $("typingIndicator")?.remove();
    addMessage("assistant", "I couldn't connect to Nova. " + (error.message || "Please try again."));
  } finally {
    busy = false;
    $("sendButton").disabled = false;
    $("prompt").focus();
  }
}

function autoResize() {
  const prompt = $("prompt");
  prompt.style.height = "auto";
  prompt.style.height = Math.min(prompt.scrollHeight, 180) + "px";
}

function closeSidebar() {
  $("sidebar").classList.remove("open");
}

$("chatForm").addEventListener("submit", e => {
  e.preventDefault();
  sendMessage();
});

$("prompt").addEventListener("input", autoResize);
$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

$("newChat").addEventListener("click", () => createChat());
$("newChatTop").addEventListener("click", () => createChat());
$("chatMode").addEventListener("click", () => setMode("chat"));
$("imageMode").addEventListener("click", () => setMode("image"));
$("menuButton").addEventListener("click", () => $("sidebar").classList.toggle("open"));

$("clearHistory").addEventListener("click", () => {
  if (!confirm("Delete all saved Nova conversations from this browser?")) return;
  chats = [];
  createChat(false);
  closeSidebar();
});

loadChats();
</script>
</body>
</html>
