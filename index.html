
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova AI</title>
<style>
:root {
  color-scheme: dark;
  --bg:#212121; --sidebar:#171717; --panel:#303030;
  --text:#f5f5f5; --muted:#aaa; --border:#3c3c3c;
  --accent:#10a37f; --hover:#2c2c2c;
}
body.light {
  color-scheme:light;
  --bg:#ffffff; --sidebar:#f7f7f8; --panel:#f4f4f4;
  --text:#202123; --muted:#666; --border:#ddd;
  --accent:#0d9373; --hover:#e9e9e9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh}
button,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:260px;flex-shrink:0;background:var(--sidebar);
display:flex;flex-direction:column;padding:12px;gap:12px;
border-right:1px solid var(--border)}
.brand{display:flex;align-items:center;justify-content:space-between;
padding:8px 5px;font-size:20px;font-weight:700}
.logo{color:var(--accent)}
.btn{border:1px solid var(--border);border-radius:10px;
background:transparent;padding:10px 12px;text-align:left}
.btn:hover,.history-item:hover{background:var(--hover)}
.new-chat{display:flex;align-items:center;gap:10px}
.history-label{font-size:12px;color:var(--muted);padding:4px 8px}
.history{flex:1;overflow-y:auto;min-height:0}
.history-item{display:flex;gap:6px;align-items:center;
border-radius:9px;padding:9px;margin:2px 0;cursor:pointer}
.history-item.active{background:var(--hover)}
.history-title{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.history-item button{border:0;background:transparent;color:var(--muted)}
.sidebar-bottom{display:grid;gap:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:56px;display:flex;align-items:center;gap:12px;
padding:0 18px;border-bottom:1px solid var(--border)}
.topbar strong{font-size:16px}
.topbar .spacer{flex:1}
.icon-btn{border:0;background:transparent;border-radius:9px;
padding:8px;font-size:19px}
.icon-btn:hover{background:var(--hover)}
#mobileMenu{display:none}
.messages{flex:1;overflow-y:auto;scroll-behavior:smooth}
.thread{max-width:800px;margin:auto;padding:28px 24px 36px}
.welcome{min-height:100%;display:flex;flex-direction:column;
align-items:center;justify-content:center;text-align:center;gap:12px;padding:25px}
.welcome-logo{width:56px;height:56px;border-radius:50%;
display:grid;place-items:center;background:var(--accent);color:white;font-size:29px}
.welcome h1{font-size:clamp(25px,4vw,34px);margin:5px 0}
.welcome p{color:var(--muted);margin:0}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
max-width:620px;margin-top:18px}
.suggestions button{border:1px solid var(--border);background:transparent;
border-radius:16px;padding:10px 13px}
.suggestions button:hover{background:var(--hover)}
.message{display:flex;flex-direction:column;margin:0 0 28px;gap:8px}
.message.user{align-items:flex-end}
.bubble{max-width:min(100%,700px);overflow-wrap:anywhere}
.user .bubble{background:var(--panel);padding:10px 15px;border-radius:20px}
.answer{white-space:pre-wrap;line-height:1.75}
.answer pre{white-space:pre-wrap;overflow-x:auto;background:var(--sidebar);
border:1px solid var(--border);border-radius:10px;padding:14px}
.answer code{background:var(--panel);border-radius:4px;padding:2px 4px}
.answer pre code{background:transparent;padding:0}
.answer a{color:var(--accent)}
.message-tools{display:flex;gap:6px;opacity:.8}
.message-tools button{border:0;background:transparent;color:var(--muted);
border-radius:7px;padding:5px 8px;font-size:12px}
.message-tools button:hover{background:var(--hover)}
.generated-image{max-width:100%;width:auto;max-height:560px;
object-fit:contain;border-radius:14px;margin-top:8px}
.composer-wrap{padding:12px 18px 18px;background:var(--bg)}
.composer-area{max-width:800px;margin:auto}
.mode-row{display:flex;gap:8px;margin-bottom:8px}
.mode{border:1px solid var(--border);border-radius:18px;
padding:6px 12px;background:transparent;font-size:13px}
.mode.active{background:var(--panel);border-color:var(--accent)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px;
border:1px solid var(--border);border-radius:25px;background:var(--panel);
box-shadow:0 3px 18px #00000010}
#prompt{flex:1;resize:none;min-height:28px;max-height:180px;
border:0;outline:0;background:transparent;color:var(--text);
padding:5px 4px}
.send{width:38px;height:38px;border:0;border-radius:50%;
background:var(--text);color:var(--bg);font-size:19px;font-weight:bold}
.send:disabled{opacity:.4;cursor:default}
.hint{text-align:center;font-size:11px;color:var(--muted);margin-top:9px}
.status{font-size:12px;color:var(--muted);padding:5px 2px;min-height:24px}
#imageModeNote{display:none;font-size:12px;color:var(--muted);margin:6px 3px}
.overlay{display:none}
@media(max-width:700px){
 .sidebar{position:fixed;z-index:5;top:0;bottom:0;left:0;
 transform:translateX(-105%);transition:transform .2s;box-shadow:8px 0 30px #0003}
 .sidebar.open{transform:translateX(0)}
 #mobileMenu{display:inline-block}
 .thread{padding:22px 14px}
 .composer-wrap{padding:10px 10px 14px}
 .topbar{padding:0 10px}
 .overlay.show{display:block;position:fixed;inset:0;z-index:4;background:#0008}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span><span class="logo">✳</span> Nova</span>
      <button class="icon-btn" id="closeSidebar" title="Close sidebar">‹</button>
    </div>
    <button class="btn new-chat" id="newChat">＋ New chat</button>
    <div class="history-label">YOUR CHATS</div>
    <div class="history" id="history"></div>
    <div class="sidebar-bottom">
      <button class="btn" id="themeBtn">☼ Switch theme</button>
      <button class="btn" id="clearBtn">⌫ Clear chat history</button>
      <div style="font-size:11px;color:var(--muted);padding:5px">Nova AI · Powered by Groq</div>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="mobileMenu" title="Open sidebar">☰</button>
      <strong>Nova</strong>
      <span class="spacer"></span>
      <button class="icon-btn" id="newChatTop" title="New chat">＋</button>
    </header>

    <section class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">✳</div>
        <h1>What can I help with?</h1>
        <p>Ask a question, learn something, or create an image.</p>
        <div class="suggestions">
          <button data-prompt="Explain something difficult in simple terms.">Explain something</button>
          <button data-prompt="Give me five creative project ideas.">Brainstorm ideas</button>
          <button data-prompt="Help me learn a new skill step by step.">Learn a skill</button>
          <button data-mode="image">Create an image</button>
        </div>
      </div>
      <div class="thread" id="thread" hidden></div>
    </section>

    <footer class="composer-wrap">
      <div class="composer-area">
        <div class="mode-row">
          <button class="mode active" id="chatMode">✳ Chat</button>
          <button class="mode" id="imageMode">▧ Create image</button>
        </div>
        <div id="imageModeNote">Describe the image you want Nova to create.</div>
        <div class="composer">
          <textarea id="prompt" rows="1" maxlength="6000"
            placeholder="Message Nova..."></textarea>
          <button class="send" id="sendBtn" title="Send message">↑</button>
        </div>
        <div class="status" id="status" role="status"></div>
        <div class="hint">Nova can make mistakes. Check important information.</div>
      </div>
    </footer>
  </main>
</div>

<script>
const WORKER_URL = "https://nova-brain.elijahmfiji.workers.dev";
const STORAGE_KEY = "nova_chats_v2";
const THEME_KEY = "nova_theme_v1";

const $ = id => document.getElementById(id);
const sidebar = $("sidebar"), overlay = $("overlay");
const messagesBox = $("messages"), thread = $("thread");
const welcome = $("welcome"), promptBox = $("prompt");
const sendBtn = $("sendBtn"), statusBox = $("status");

let chats = [];
let currentId = null;
let mode = "chat";
let busy = false;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function save(){
  try {localStorage.setItem(STORAGE_KEY,JSON.stringify(chats));}
  catch(e){statusBox.textContent="Couldn't save chat history in this browser."}
}
function load(){
  try {
    const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
    if(Array.isArray(raw)) chats=raw.filter(c=>c&&Array.isArray(c.messages)).slice(0,80);
  } catch(e){chats=[]}
  const theme=localStorage.getItem(THEME_KEY);
  if(theme==="light")document.body.classList.add("light");
  if(chats.length)openChat(chats[0].id);else newChat();
  renderHistory();
}
function makeTitle(text){
  return text.trim().replace(/\s+/g," ").slice(0,38)||"New chat";
}
function newChat(){
  currentId=uid();
  chats.unshift({id:currentId,title:"New chat",messages:[],updated:Date.now()});
  mode="chat";setMode("chat");save();renderHistory();renderMessages();
  promptBox.focus();closeMobile();
}
function currentChat(){return chats.find(c=>c.id===currentId)}
function openChat(id){
  const chat=chats.find(c=>c.id===id);if(!chat)return;
  currentId=id;mode="chat";setMode("chat");renderHistory();renderMessages();closeMobile();
}
function renderHistory(){
  const host=$("history");host.replaceChildren();
  chats.slice().sort((a,b)=>(b.updated||0)-(a.updated||0)).forEach(chat=>{
    const row=document.createElement("div");
    row.className="history-item"+(chat.id===currentId?" active":"");
    const title=document.createElement("span");title.className="history-title";
    title.textContent=chat.title||"New chat";title.title=title.textContent;
    title.onclick=()=>openChat(chat.id);
    const del=document.createElement("button");del.textContent="×";del.title="Delete chat";
    del.onclick=e=>{e.stopPropagation();deleteChat(chat.id)};
    row.append(title,del);host.append(row);
  });
}
function deleteChat(id){
  chats=chats.filter(c=>c.id!==id);save();
  if(currentId===id){if(chats.length)openChat(chats[0].id);else newChat();}
  renderHistory();
}
function clearHistory(){
  if(!confirm("Delete all saved Nova chats from this browser?"))return;
  chats=[];save();newChat();renderHistory();
}
function renderMessages(){
  const chat=currentChat();thread.replaceChildren();
  const hasMessages=!!(chat&&chat.messages.length);
  welcome.hidden=hasMessages;thread.hidden=!hasMessages;
  if(hasMessages)chat.messages.forEach((m,i)=>addMessageElement(m,i));
  messagesBox.scrollTop=messagesBox.scrollHeight;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// Safe, lightweight Markdown rendering (not a full Markdown implementation).
function formatText(s){
  let t=escapeHTML(s);
  t=t.replace(/```([\s\S]*?)```/g,(_,c)=>"<pre><code>"+c.trim()+"</code></pre>");
  t=t.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  t=t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/\*(.+?)\*/g,"<em>$1</em>");
  t=t.replace(/(^|\n)### (.+)/g,"$1<strong>$2</strong>");
  t=t.replace(/(^|\n)## (.+)/g,"$1<strong>$2</strong>");
  t=t.replace(/\n/g,"<br>");
  return t;
}
function addMessageElement(m,index){
  const wrap=document.createElement("article");wrap.className="message "+(m.role==="user"?"user":"assistant");
  const bubble=document.createElement("div");bubble.className="bubble";
  if(m.image){
    const img=document.createElement("img");img.src=m.image;img.alt=m.alt||"Image generated by Nova";img.className="generated-image";
    bubble.append(img);
  }else{
    const text=document.createElement("div");text.className="answer";
    text.innerHTML=formatText(m.content||"");bubble.append(text);
  }
  wrap.append(bubble);
  if(m.role!=="user"){
    const tools=document.createElement("div");tools.className="message-tools";
    const copy=document.createElement("button");copy.textContent="▢ Copy";
    copy.onclick=async()=>{try{await navigator.clipboard.writeText(m.content||"");copy.textContent="Copied!";setTimeout(()=>copy.textContent="▢ Copy",1200)}catch(e){statusBox.textContent="Copy isn't available in this browser."}};
    tools.append(copy);wrap.append(tools);
  }
  thread.append(wrap);
}
function addMessage(m){
  const chat=currentChat();chat.messages.push(m);chat.updated=Date.now();
  if(m.role==="user"&&chat.messages.filter(x=>x.role==="user").length===1)chat.title=makeTitle(m.content);
  save();renderMessages();renderHistory();
}
function setMode(next){
  mode=next;
  $("chatMode").classList.toggle("active",mode==="chat");
  $("imageMode").classList.toggle("active",mode==="image");
  $("imageModeNote").style.display=mode==="image"?"block":"none";
  promptBox.placeholder=mode==="image"?"Describe an image to create...":"Message Nova...";
  promptBox.rows=1;
}
function setBusy(value){
  busy=value;sendBtn.disabled=value;sendBtn.textContent=value?"…":"↑";
  if(!value)statusBox.textContent="";
}
function closeMobile(){sidebar.classList.remove("open");overlay.classList.remove("show")}
function openMobile(){sidebar.classList.add("open");overlay.classList.add("show")}

async function send(){
  const text=promptBox.value.trim();if(!text||busy)return;
  promptBox.value="";promptBox.style.height="auto";
  if(!currentChat())newChat();
  if(mode==="image"){
    addMessage({role:"user",content:"Create image: "+text});
    const placeholder={role:"assistant",content:"Generating image…"};
    addMessage(placeholder);setBusy(true);statusBox.textContent="Creating your image…";
    try{
      const res=await fetch(WORKER_URL+"/image",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({prompt:text})
      });
      const data=await res.json();
      if(!res.ok||!data.image)throw new Error(data.error||"Image generation failed.");
      const chat=currentChat();
      chat.messages.pop();
      chat.messages.push({role:"assistant",content:"Here is your generated image.",image:data.image,alt:text});
      chat.updated=Date.now();save();renderMessages();
    }catch(e){
      const chat=currentChat();chat.messages.pop();
      chat.messages.push({role:"assistant",content:"Sorry, I couldn't create that image. "+e.message});
      save();renderMessages();
    }finally{setBusy(false)}
    return;
  }

  addMessage({role:"user",content:text});
  setBusy(true);statusBox.textContent="Nova is thinking…";
  try{
    const chat=currentChat();
    const res=await fetch(WORKER_URL+"/chat",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:chat.messages
        .filter(m=>m.role==="user"||m.role==="assistant")
        .filter(m=>!m.image)
        .map(m=>({role:m.role,content:m.content||""}))})
    });
    const data=await res.json();
    if(!res.ok||!data.reply)throw new Error(data.error||"Chat request failed.");
    addMessage({role:"assistant",content:data.reply});
  }catch(e){
    addMessage({role:"assistant",content:"I couldn't connect to Nova. "+e.message});
  }finally{setBusy(false);messagesBox.scrollTop=messagesBox.scrollHeight}
}

$("newChat").onclick=newChat;$("newChatTop").onclick=newChat;
$("closeSidebar").onclick=closeMobile;$("mobileMenu").onclick=openMobile;
overlay.onclick=closeMobile;$("clearBtn").onclick=clearHistory;
$("chatMode").onclick=()=>setMode("chat");$("imageMode").onclick=()=>setMode("image");
$("themeBtn").onclick=()=>{
  document.body.classList.toggle("light");
  localStorage.setItem(THEME_KEY,document.body.classList.contains("light")?"light":"dark");
};
sendBtn.onclick=send;
promptBox.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}
});
promptBox.addEventListener("input",()=>{
  promptBox.style.height="auto";
  promptBox.style.height=Math.min(promptBox.scrollHeight,180)+"px";
});
document.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>{
  promptBox.value=b.dataset.prompt;promptBox.focus();
});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
  setMode(b.dataset.mode);promptBox.focus();
});
load();
</script>
</body>
</html>
