
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova AI — Your Personal Assistant</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d17;
      color: #f1f3fc;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 850px;
      min-height: 100vh;
      margin: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 20px;
      border-bottom: 1px solid #292d40;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      display: grid;
      place-items: center;
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: linear-gradient(135deg, #8067ff, #38c9ff);
      font-size: 25px;
    }

    h1 { margin: 0; font-size: 23px; }
    .subtitle { color: #9ba5c1; font-size: 12px; margin-top: 5px; }

    button, textarea { font: inherit; }

    button {
      cursor: pointer;
      color: #f1f3fc;
      background: #191e30;
      border: 1px solid #343b55;
      border-radius: 12px;
      padding: 11px 14px;
    }

    button:hover { background: #282e47; }
    button:disabled { opacity: .6; cursor: wait; }

    #messages { flex: 1; padding: 20px 0; }

    .welcome { text-align: center; padding: 65px 8px 35px; }
    .star { font-size: 48px; color: #9a8cff; }
    .welcome h2 { font-size: 31px; margin: 14px 0; }
    .welcome p { color: #a8b1c9; line-height: 1.7; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 25px;
    }

    .message {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 18px 0;
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      flex: 0 0 35px;
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #242943;
      color: #b9adff;
      font-weight: bold;
    }

    .bubble {
      max-width: 85%;
      padding: 13px 15px;
      border-radius: 14px;
      border: 1px solid #2c3249;
      background: #151a2a;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.65;
    }

    .message.user .bubble {
      background: #282348;
      border-color: #484071;
    }

    .composer {
      position: sticky;
      bottom: 0;
      padding: 12px 0 8px;
      background: #0b0d17;
    }

    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px;
      border: 1px solid #343b55;
      border-radius: 17px;
      background: #14192a;
    }

    textarea {
      flex: 1;
      min-width: 0;
      max-height: 150px;
      resize: none;
      padding: 9px 5px;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      line-height: 1.5;
    }

    #send {
      background: #7967f5;
      border-color: #7967f5;
      font-weight: bold;
    }

    .footnote {
      text-align: center;
      color: #838ca5;
      font-size: 11px;
      margin-top: 10px;
    }

    @media (max-width: 500px) {
      .app { padding: 12px; }
      .welcome { padding-top: 45px; }
      .welcome h2 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">✦</div>
        <div>
          <h1>Nova AI</h1>
          <div class="subtitle">Your personal AI assistant</div>
        </div>
      </div>
      <button id="newChat" type="button">New chat</button>
    </header>

    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="star">✦</div>
        <h2>Hey, I'm Nova.</h2>
        <p>Your personal AI assistant.<br>What are we working on today?</p>
        <div class="suggestions" id="suggestions">
          <button type="button" data-prompt="Give me three creative ideas.">Creative ideas</button>
          <button type="button" data-prompt="Teach me something interesting.">Teach me something</button>
          <button type="button" data-prompt="Help me plan my day.">Plan my day</button>
        </div>
      </div>
    </section>

    <section class="composer">
      <div class="input-wrap">
        <textarea id="prompt" rows="1" placeholder="Message Nova..." aria-label="Message Nova"></textarea>
        <button id="send" type="button">Send ↑</button>
      </div>
      <div class="footnote">Nova can make mistakes. Check important information.</div>
    </section>
  </main>

  <script>
    // Nova's Cloudflare Worker address
    const WORKER_URL = "https://nova-brain.elijahmfiji.workers.dev";

    const promptBox = document.getElementById("prompt");
    const messagesBox = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const suggestions = document.getElementById("suggestions");
    const sendButton = document.getElementById("send");

    let conversation = [];

    function addMessage(text, who) {
      const row = document.createElement("div");
      row.className = "message " + who;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = who === "user" ? "Y" : "✦";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.append(avatar, bubble);
      messagesBox.appendChild(row);
      row.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    async function sendMessage(text) {
      const clean = text.trim();
      if (!clean || sendButton.disabled) return;

      welcome.style.display = "none";
      suggestions.style.display = "none";
      addMessage(clean, "user");

      promptBox.value = "";
      promptBox.style.height = "auto";
      sendButton.disabled = true;

      const pending = document.createElement("div");
      pending.className = "message assistant";

      const pendingAvatar = document.createElement("div");
      pendingAvatar.className = "avatar";
      pendingAvatar.textContent = "✦";

      const pendingBubble = document.createElement("div");
      pendingBubble.className = "bubble";
      pendingBubble.textContent = "Nova is thinking...";

      pending.append(pendingAvatar, pendingBubble);
      messagesBox.appendChild(pending);

      const newMessages = [
        ...conversation,
        { role: "user", content: clean }
      ].slice(-20);

      try {
        const response = await fetch(
          WORKER_URL + "/chat",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: newMessages })
          }
        );

        const data = await response.json();
        pending.remove();

        if (!response.ok || typeof data.reply !== "string") {
          throw new Error(data.error || "The AI service returned an error.");
        }

        conversation = [
          ...newMessages,
          { role: "assistant", content: data.reply }
        ].slice(-20);

        addMessage(data.reply, "assistant");
      } catch (error) {
        pending.remove();
        addMessage(
          "I couldn't connect to my AI brain. Check that the Worker is deployed, the GROQ_API_KEY secret is correct, and the Worker allows this website. Details: " +
          (error.message || "Connection failed"),
          "assistant"
        );
      } finally {
        sendButton.disabled = false;
        promptBox.focus();
      }
    }

    sendButton.addEventListener("click", () => {
      sendMessage(promptBox.value);
    });

    promptBox.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(promptBox.value);
      }
    });

    promptBox.addEventListener("input", () => {
      promptBox.style.height = "auto";
      promptBox.style.height =
        Math.min(promptBox.scrollHeight, 150) + "px";
    });

    document.querySelectorAll("[data-prompt]").forEach(button => {
      button.addEventListener("click", () => {
        sendMessage(button.dataset.prompt);
      });
    });

    document.getElementById("newChat").addEventListener("click", () => {
      conversation = [];
      messagesBox.replaceChildren();
      messagesBox.appendChild(welcome);
      welcome.style.display = "";
      suggestions.style.display = "";
      promptBox.value = "";
      promptBox.focus();
    });
  </script>
</body>
</html>
